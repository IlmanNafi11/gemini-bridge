[package]
name = "gemini-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gemini-bridge"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
gemini-bridge-config = { path = "crates/config" }
gemini-bridge-identity = { path = "crates/identity" }
gemini-bridge-http-server = { path = "crates/http-server" }

[dev-dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
wiremock = { workspace = true }
axum = { workspace = true }
gemini-bridge-config = { path = "crates/config" }
gemini-bridge-identity = { path = "crates/identity" }
gemini-bridge-adapter-gemini = { path = "crates/gemini-adapter" }
gemini-bridge-openai-compat = { path = "crates/openai-compat" }
gemini-bridge-http-server = { path = "crates/http-server" }
gemini-bridge-upload = { path = "crates/upload" }
gemini-bridge-media-store = { path = "crates/media-store" }
gemini-bridge-image-gen = { path = "crates/image-gen" }
gemini-bridge-llm-service = { path = "crates/llm-service" }
gemini-bridge-middleware = { path = "crates/middleware" }
base64 = "0.22"
futures = { workspace = true }
parking_lot = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/plugin-context",
    "crates/config",
    "crates/transport",
    "crates/identity",
    "crates/llm-service",
    "crates/gemini-adapter",
    "crates/openai-compat",
    "crates/http-server",
    "crates/media-store",
    "crates/upload",
    "crates/image-gen",
    "crates/health-admin",
    "crates/middleware",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Afi"]

[workspace.dependencies]
thiserror = "2"
parking_lot = "0.12"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bytes = "1"
http = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json", "multipart", "stream"] }
wiremock = "0.6"
clap = { version = "4", features = ["derive", "env"] }
aes-gcm = "0.10"
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
serde_json = "1"
futures = "0.3"
insta = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "request-id", "trace"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
