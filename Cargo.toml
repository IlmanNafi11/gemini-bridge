[workspace]
resolver = "2"
members = [
    "crates/plugin-context",
    "crates/config",
    "crates/transport",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Afi"]

[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bytes = "1"
http = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json"] }
wiremock = "0.6"
